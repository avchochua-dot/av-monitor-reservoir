
name: A Vuong - Bao cao KTTV PDF & Email thu (4 ky mua mua)

# Lich chay do Supabase Cron quan ly.
# 01:10, 07:10, 13:10, 19:10 gio Viet Nam.
# GitHub chi nhan lenh workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Ngay bao cao VN YYYY-MM-DD, bo trong = hom nay"
        required: false
        type: string

      report_hour:
        description: "Ky bao cao gio Viet Nam"
        required: true
        default: "19"
        type: choice
        options:
          - "01"
          - "07"
          - "13"
          - "19"

      send_test_email:
        description: "Gui email thu nghiem toi REPORT_TEST_TO?"
        required: true
        type: boolean
        default: false

      retry_failed:
        description: "Thu lai SMTP FAILED sau khi da xac minh"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: avuong-kttv-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate KTTV PDF
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESERVOIR_ID: "is.null"
      SOURCE_TIME_MODE: "vn_label_stored_as_utc"

      REPORT_TEST_TO: ${{ secrets.REPORT_TEST_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
      SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'ssl' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}

      MANUAL_REPORT_DATE: ${{ inputs.report_date }}
      MANUAL_REPORT_HOUR: ${{ inputs.report_hour }}
      MANUAL_TEST_SEND: ${{ inputs.send_test_email }}
      RETRY_FAILED: ${{ inputs.retry_failed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve report issue VN
        shell: bash
        run: |
          set -euo pipefail

          REPORT_HOUR="$MANUAL_REPORT_HOUR"
          REPORT_DATE="$MANUAL_REPORT_DATE"
          RUN_TYPE="DISPATCH"

          case "$REPORT_HOUR" in
            01|07|13|19) ;;
            *)
              echo "::error::Invalid report hour"
              exit 1
              ;;
          esac

          if [[ -z "$REPORT_DATE" ]]; then
            REPORT_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          fi

          if ! date -d "$REPORT_DATE" +%F >/dev/null 2>&1; then
            echo "::error::Invalid report date"
            exit 1
          fi

          {
            echo "REPORT_HOUR=$REPORT_HOUR"
            echo "REPORT_DATE=$REPORT_DATE"
            echo "RUN_TYPE=$RUN_TYPE"
          } >> "$GITHUB_ENV"

          echo "REPORT ISSUE: ${REPORT_DATE} ${REPORT_HOUR}:00 VN"
          echo "TRIGGER: workflow_dispatch"

      - name: Install fonts and report requirements
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core

          python -m pip install \
            -r reports/avuong_kttv/requirements.txt

      - name: Validate Python source
        shell: bash
        run: |
          python -m py_compile \
            reports/avuong_kttv/scripts/generate_kttv_report.py

      - name: Generate PDF and send TEST email
        shell: bash
        run: |
          set -euo pipefail

          MODE="preview"

          if [[ "$MANUAL_TEST_SEND" == "true" ]]; then
            MODE="test-email"
          fi

          EXTRA=()

          if [[ -n "$REPORT_DATE" ]]; then
            EXTRA+=(--date "$REPORT_DATE")
          fi

          # Thieu du lieu: giu trang thai PENDING_DATA.
          # Khong phat hanh bao cao khi thieu du lieu.
          EXTRA+=(--allow-pending-data)

          # Khong tu dong retry SMTP that bai.
          if [[ "$RETRY_FAILED" == "true" ]]; then
            EXTRA+=(--retry-failed)
          fi

          echo "======================================"
          echo "A VUONG KTTV REPORT"
          echo "DATE: $REPORT_DATE"
          echo "HOUR: $REPORT_HOUR"
          echo "MODE: $MODE"
          echo "======================================"

          python reports/avuong_kttv/scripts/generate_kttv_report.py \
            --hour "$REPORT_HOUR" \
            --mode "$MODE" \
            --output-dir reports/avuong_kttv/reports/output \
            "${EXTRA[@]}"

      - name: Upload report PDF or pending-data audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KTTV-PDF-${{ github.run_id }}
          path: reports/avuong_kttv/reports/output/*
          if-no-files-found: warn
          retention-days: 60
