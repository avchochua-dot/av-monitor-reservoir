name: Diagnose RF Downstream Data Freshness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements-rf-downstream.txt

      - name: Diagnose PCTT and downstream observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PCTT_API_BASE: https://av-monitor-reservoir.vercel.app
        run: |
          python scripts/diagnose_rf_downstream_inputs.py --hours 72 --max-age-h 4
