name: A Vuong Rainfall + RF Forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: read

concurrency:
  group: avuong-rainfall-rf-production
  cancel-in-progress: false

jobs:
  collect-rainfall-and-predict-inflow:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Nếu reservoir_hourly_data có nhiều hồ:
      # RESERVOIR_ID: ${{ secrets.RESERVOIR_ID }}

      # Rainfall collector
      FORECAST_DAYS: "10"
      BASIN_ID: "AVUONG"

      # RF V1 short benchmark model
      RF_MODEL_DIR: "models/rf_v1"
      RF_SOURCE: "rf_v1"
      RF_MODEL_VERSION: "RF_V1_PERFECT_RAIN"
      RF_RELEASE_TAG: "rf-v1"

      # Long-Horizon model
      LONG_MODEL_DIR: "models/long_h120"
      LONG_SOURCE: "long_h120"
      LONG_MODEL_VERSION: "LONG_H120_V1_PERFECT_RAIN"
      LONG_MAX_LEAD: "120"

      # Rain freshness guard
      MAX_RAIN_RUN_AGE_HOURS: "12"

    steps:
      # ======================================================
      # 1. CHECKOUT
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. PYTHON
      # ======================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements_rf_live.txt
            scripts/requirements_long_live.txt

      # ======================================================
      # 3. DEPENDENCIES
      # ======================================================
      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -r scripts/requirements_rf_live.txt
          pip install -r scripts/requirements_long_live.txt

      # ======================================================
      # 4. SECRETS
      # ======================================================
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "ERROR: Missing GitHub secret SUPABASE_URL"
            exit 1
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "ERROR: Missing GitHub secret SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          echo "Supabase secrets are available."

      # ======================================================
      # 5. VALIDATE RF V1 METADATA
      # ======================================================
      - name: Validate RF V1 metadata files
        shell: bash
        run: |
          set -euo pipefail

          test -f models/rf_v1/rf_h01_meta.json
          test -f models/rf_v1/rf_h03_meta.json
          test -f models/rf_v1/rf_h06_meta.json
          test -f models/rf_v1/rf_h12_meta.json
          test -f models/rf_v1/rf_h24_meta.json

          echo "RF V1 metadata files are present."

      # ======================================================
      # 6. RF V1 LARGE MODEL CACHE
      # ======================================================
      - name: Restore RF V1 model cache
        id: rf-model-cache
        uses: actions/cache@v4
        with:
          path: |
            models/rf_v1/rf_h01.joblib
            models/rf_v1/rf_h03.joblib
            models/rf_v1/rf_h06.joblib
            models/rf_v1/rf_h12.joblib
            models/rf_v1/rf_h24.joblib
          key: avuong-rf-models-${{ runner.os }}-rf-v1

      # ======================================================
      # 7. DOWNLOAD RF V1 MODELS IF CACHE MISS
      # ======================================================
      - name: Download RF V1 models from GitHub Release
        if: steps.rf-model-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p models/rf_v1

          gh release download "${RF_RELEASE_TAG}" \
            --pattern "rf_h01.joblib" \
            --pattern "rf_h03.joblib" \
            --pattern "rf_h06.joblib" \
            --pattern "rf_h12.joblib" \
            --pattern "rf_h24.joblib" \
            --dir models/rf_v1 \
            --clobber

          ls -lh models/rf_v1/*.joblib

      # ======================================================
      # 8. VALIDATE ALL MODEL ARTIFACTS
      # ======================================================
      - name: Validate model artifacts
        shell: bash
        run: |
          set -euo pipefail

          # RF V1
          test -s models/rf_v1/rf_h01.joblib
          test -s models/rf_v1/rf_h03.joblib
          test -s models/rf_v1/rf_h06.joblib
          test -s models/rf_v1/rf_h12.joblib
          test -s models/rf_v1/rf_h24.joblib

          # Long-H120
          test -s models/long_h120/long_h120.joblib
          test -f models/long_h120/long_h120_meta.json

          echo "All RF V1 + Long-H120 model artifacts are ready."

      # ======================================================
      # 9. COLLECT 6-MODEL RAINFALL
      # ======================================================
      - name: Collect A Vuong multi-model rainfall forecast
        shell: bash
        run: |
          set -euo pipefail
          python scripts/avuong_multimodel_collector.py

      # ======================================================
      # 10. RF V1 SHORT FORECAST
      # ======================================================
      - name: Run RF V1 inflow predictor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rf_predict.py

      # ======================================================
      # 11. LONG-H120 6-SCENARIO FORECAST
      # ======================================================
      - name: Run Long-H120 six-scenario inflow predictor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rf_predict_long_h120.py

      # ======================================================
      # 12. SUMMARY
      # ======================================================
      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "===================================================="
          echo "A VUONG RAINFALL + RF + LONG-H120 WORKFLOW"
          echo "===================================================="
          echo "Rainfall : 6 NWP models x 7 basin points"
          echo "RF V1    : H01/H03/H06/H12/H24"
          echo "Long     : H01-H120 hourly"
          echo "Scenario : ECMWF/GFS/ICON/AIFS/CMA/JMA"
          echo "Ensemble : Mean / P50 / P10 / P90 / Min / Max"
          echo "===================================================="
