name: A Vuong Rainfall + RF Forecast + Long H120 + LSTM 7 Scenario

on:
  workflow_dispatch:
    inputs:
      force_predict:
        description: "Force RF V1 + Long-H120 + LSTM even if issue_time has not advanced"
        required: false
        default: false
        type: boolean

  # GitHub cron uses UTC.
  # HH:05 = run chính.
  # HH:10 = retry 1 lần nếu đến phút 10 mới có Q quan trắc giờ mới.
  schedule:
    - cron: "5 * * * *"
    - cron: "10 * * * *"

permissions:
  contents: read

concurrency:
  group: avuong-rainfall-rf-long-lstm-openmeteo7-production
  cancel-in-progress: false

jobs:
  collect-rainfall-and-predict-inflow:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Nếu reservoir_hourly_data có nhiều hồ, tạo secret RESERVOIR_ID.
      RESERVOIR_ID: ${{ secrets.RESERVOIR_ID }}

      FORECAST_DAYS: "10"
      BASIN_ID: "AVUONG"

      # ==========================================================
      # RF V1
      # ==========================================================
      RF_MODEL_DIR: "models/rf_v1"
      RF_SOURCE: "rf_v1"
      RF_MODEL_VERSION: "RF_V1_PERFECT_RAIN"
      RF_RELEASE_TAG: "rf-v1"

      # ==========================================================
      # LONG H120 - HGB
      # ==========================================================
      LONG_MODEL_DIR: "models/long_h120"
      LONG_SOURCE: "long_h120"
      LONG_MODEL_VERSION: "LONG_H120_V1_PERFECT_RAIN"
      LONG_MAX_LEAD: "120"

      # ==========================================================
      # LSTM H120 - SHADOW
      # 7 kịch bản:
      # ECMWF / GFS / ICON / AIFS / CMA / JMA / OPENMETEO_BEST
      # ==========================================================
      LSTM_MODEL_DIR: "models/lstm_h120_v1"
      LSTM_SOURCE: "lstm_h120_v1"
      LSTM_MODEL_VERSION: "LSTM_H120_V1_PERFECT_RAIN"
      LSTM_MAX_LEAD: "120"
      LSTM_LOOKBACK_HOURS: "168"

      MAX_RAIN_RUN_AGE_HOURS: "12"

    steps:
      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. PYTHON
      # ==========================================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements_rf_live.txt
            scripts/requirements_long_live.txt
            scripts/requirements_lstm_live.txt

      # ==========================================================
      # 3. INSTALL
      # ==========================================================
      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install -r scripts/requirements.txt
          pip install -r scripts/requirements_rf_live.txt
          pip install -r scripts/requirements_long_live.txt
          pip install -r scripts/requirements_lstm_live.txt

      # ==========================================================
      # 4. RUNTIME
      # ==========================================================
      - name: Print Python ML runtime
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          import numpy
          import pandas
          import sklearn
          import joblib
          import tensorflow as tf

          print("Python       :", sys.version)
          print("numpy        :", numpy.__version__)
          print("pandas       :", pandas.__version__)
          print("scikit-learn :", sklearn.__version__)
          print("joblib       :", joblib.__version__)
          print("TensorFlow   :", tf.__version__)
          print("GPU          :", tf.config.list_physical_devices("GPU"))
          PY

      # ==========================================================
      # 5. SECRETS
      # ==========================================================
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "ERROR: Missing GitHub secret SUPABASE_URL"
            exit 1
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "ERROR: Missing GitHub secret SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          echo "Supabase secrets are available."

      # ==========================================================
      # 6. HH:05 / MANUAL - REFRESH RAINFALL
      # ==========================================================
      # Collector 1:
      # 6 NWP riêng biệt qua Open-Meteo:
      # ECMWF/GFS/ICON/AIFS/CMA/JMA
      - name: Collect 6-model rainfall at minute 05
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 * * * *'
        shell: bash
        run: |
          set -euo pipefail
          echo "Collecting 6-model A Vuong rainfall forecast..."
          python scripts/avuong_multimodel_collector.py

      # Collector 2:
      # Open-Meteo default / Best Match, 7 điểm AV01-AV07 -> basin hourly H001-H120.
      - name: Collect Open-Meteo Best Match at minute 05
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 * * * *'
        shell: bash
        run: |
          set -euo pipefail
          echo "Collecting Open-Meteo Best Match rainfall..."
          python scripts/avuong_openmeteo_best_collector.py

      # ==========================================================
      # 7. FORECAST GATE V2 - LONG & LSTM ĐỘC LẬP
      # ==========================================================
      # Mỗi mô hình có issue_time riêng:
      # - Long-H120 kiểm tra latest Long issue_time
      # - LSTM-H120 kiểm tra latest LSTM issue_time
      #
      # Nhờ vậy nếu Long đã chạy tới 19h nhưng LSTM vẫn ở 14h,
      # workflow vẫn bắt buộc chạy lại LSTM cho giờ 19h.
      - name: Check new observed hour for Long and LSTM independently
        id: forecast-gate
        shell: bash
        env:
          FORCE_PREDICT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_predict || false }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from supabase import create_client

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          reservoir_id = (os.environ.get("RESERVOIR_ID") or "").strip()
          force = str(os.environ.get("FORCE_PREDICT", "false")).lower() == "true"

          sb = create_client(url, key)

          # -------------------------------------------------------
          # 1. Latest observed reservoir hour
          # -------------------------------------------------------
          q = (
              sb.table("reservoir_hourly_data")
              .select("time,reservoir_id")
              .order("time", desc=True)
              .limit(50 if reservoir_id else 1)
          )

          if reservoir_id:
              q = q.eq("reservoir_id", reservoir_id)

          obs_rows = q.execute().data or []
          latest_obs = obs_rows[0]["time"] if obs_rows else None

          # -------------------------------------------------------
          # 2. Latest Long-H120 issue
          # -------------------------------------------------------
          long_rows = (
              sb.table("inflow_forecast_long_ensemble")
              .select("issue_time")
              .order("issue_time", desc=True)
              .limit(1)
              .execute()
              .data
              or []
          )
          latest_long_issue = (
              long_rows[0]["issue_time"]
              if long_rows else None
          )

          # -------------------------------------------------------
          # 3. Latest LSTM-H120 issue
          # -------------------------------------------------------
          lstm_rows = (
              sb.table("inflow_forecast_lstm_ensemble")
              .select("issue_time")
              .order("issue_time", desc=True)
              .limit(1)
              .execute()
              .data
              or []
          )
          latest_lstm_issue = (
              lstm_rows[0]["issue_time"]
              if lstm_rows else None
          )

          def parse_dt(v):
              if not v:
                  return None
              return datetime.fromisoformat(
                  str(v).replace("Z", "+00:00")
              ).astimezone(timezone.utc)

          obs_dt = parse_dt(latest_obs)
          long_dt = parse_dt(latest_long_issue)
          lstm_dt = parse_dt(latest_lstm_issue)

          # -------------------------------------------------------
          # 4. Independent decisions
          # -------------------------------------------------------
          if force:
              need_long = True
              need_lstm = True
              long_reason = "manual force_predict=true"
              lstm_reason = "manual force_predict=true"

          elif obs_dt is None:
              need_long = False
              need_lstm = False
              long_reason = "no observed reservoir_hourly_data available"
              lstm_reason = "no observed reservoir_hourly_data available"

          else:
              if long_dt is None:
                  need_long = True
                  long_reason = "no Long-H120 forecast exists yet"
              elif obs_dt > long_dt:
                  need_long = True
                  long_reason = "observed hour is newer than Long-H120 issue_time"
              else:
                  need_long = False
                  long_reason = "Long-H120 is already current"

              if lstm_dt is None:
                  need_lstm = True
                  lstm_reason = "no LSTM-H120 forecast exists yet"
              elif obs_dt > lstm_dt:
                  need_lstm = True
                  lstm_reason = "observed hour is newer than LSTM-H120 issue_time"
              else:
                  need_lstm = False
                  lstm_reason = "LSTM-H120 is already current"

          need_any = need_long or need_lstm

          print("========================================================")
          print("FORECAST GATE V2")
          print("========================================================")
          print("Latest observed time :", latest_obs)
          print("Latest Long issue    :", latest_long_issue)
          print("Latest LSTM issue    :", latest_lstm_issue)
          print("")
          print("Need Long            :", need_long)
          print("Long reason          :", long_reason)
          print("Need LSTM            :", need_lstm)
          print("LSTM reason          :", lstm_reason)
          print("Need any forecast    :", need_any)
          print("========================================================")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as f:
              f.write(f"need_long={'true' if need_long else 'false'}\n")
              f.write(f"need_lstm={'true' if need_lstm else 'false'}\n")
              f.write(f"need_any={'true' if need_any else 'false'}\n")
              f.write(f"latest_obs={latest_obs or ''}\n")
              f.write(f"latest_long_issue={latest_long_issue or ''}\n")
              f.write(f"latest_lstm_issue={latest_lstm_issue or ''}\n")
              f.write(f"long_reason={long_reason}\n")
              f.write(f"lstm_reason={lstm_reason}\n")
          PY

      # ==========================================================
      # 8. HH:10 RETRY
      # ==========================================================
      # Nếu Q giờ mới chỉ tới sau phút 05, phút 10 sẽ check lại.
      # Nếu cần forecast, refresh CẢ 2 nguồn mưa trước khi chạy model.
      - name: Refresh 6-model rainfall on minute-10 retry
        if: github.event.schedule == '10 * * * *' && steps.forecast-gate.outputs.need_any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Minute-10 retry: refreshing 6-model rainfall..."
          python scripts/avuong_multimodel_collector.py

      - name: Refresh Open-Meteo Best Match on minute-10 retry
        if: github.event.schedule == '10 * * * *' && steps.forecast-gate.outputs.need_any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Minute-10 retry: refreshing Open-Meteo Best Match..."
          python scripts/avuong_openmeteo_best_collector.py

      # ==========================================================
      # 9. MODEL PREPARATION
      # ==========================================================
      - name: Validate RF V1 metadata files
        if: steps.forecast-gate.outputs.need_long == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -f models/rf_v1/rf_h01_meta.json
          test -f models/rf_v1/rf_h03_meta.json
          test -f models/rf_v1/rf_h06_meta.json
          test -f models/rf_v1/rf_h12_meta.json
          test -f models/rf_v1/rf_h24_meta.json

          echo "RF V1 metadata files are present."

      - name: Restore RF V1 model cache
        if: steps.forecast-gate.outputs.need_long == 'true'
        id: rf-model-cache
        uses: actions/cache@v4
        with:
          path: |
            models/rf_v1/rf_h01.joblib
            models/rf_v1/rf_h03.joblib
            models/rf_v1/rf_h06.joblib
            models/rf_v1/rf_h12.joblib
            models/rf_v1/rf_h24.joblib
          key: avuong-rf-models-${{ runner.os }}-rf-v1

      - name: Download RF V1 models from GitHub Release
        if: steps.forecast-gate.outputs.need_long == 'true' && steps.rf-model-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p models/rf_v1

          gh release download "${RF_RELEASE_TAG}" \
            --pattern "rf_h01.joblib" \
            --pattern "rf_h03.joblib" \
            --pattern "rf_h06.joblib" \
            --pattern "rf_h12.joblib" \
            --pattern "rf_h24.joblib" \
            --dir models/rf_v1 \
            --clobber

          ls -lh models/rf_v1/*.joblib

      - name: Validate RF and Long-H120 artifacts
        if: steps.forecast-gate.outputs.need_long == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -s models/rf_v1/rf_h01.joblib
          test -s models/rf_v1/rf_h03.joblib
          test -s models/rf_v1/rf_h06.joblib
          test -s models/rf_v1/rf_h12.joblib
          test -s models/rf_v1/rf_h24.joblib

          test -s models/long_h120/long_h120.joblib
          test -f models/long_h120/long_h120_meta.json

          echo "RF + Long-H120 artifacts are present."

      - name: Validate LSTM H120 artifacts
        if: steps.forecast-gate.outputs.need_lstm == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -s models/lstm_h120_v1/lstm_h120.keras
          test -s models/lstm_h120_v1/lstm_h120_scalers.joblib

          echo "LSTM H120 artifacts are present."

      - name: Smoke test Long-H120 model load
        if: steps.forecast-gate.outputs.need_long == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import joblib

          path = "models/long_h120/long_h120.joblib"
          model = joblib.load(path)

          print("Long-H120 model loaded successfully.")
          print("Model class:", type(model))
          PY

      - name: Smoke test LSTM H120 model load
        if: steps.forecast-gate.outputs.need_lstm == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import joblib
          import tensorflow as tf

          model_path = "models/lstm_h120_v1/lstm_h120.keras"
          scaler_path = "models/lstm_h120_v1/lstm_h120_scalers.joblib"

          model = tf.keras.models.load_model(
              model_path,
              compile=False
          )
          scalers = joblib.load(scaler_path)

          print("LSTM H120 loaded successfully.")
          print("Model class :", type(model))
          print("Input shape :", model.input_shape)
          print("Output shape:", model.output_shape)
          print("Lookback    :", scalers.get("lookback_hours"))
          print("Horizon     :", scalers.get("horizon_hours"))
          PY

      # ==========================================================
      # 10. FORECASTS
      # ==========================================================
      - name: Run RF V1 inflow predictor
        if: steps.forecast-gate.outputs.need_long == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rf_predict.py

      - name: Run Long-H120 six-scenario inflow predictor
        if: steps.forecast-gate.outputs.need_long == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rf_predict_long_h120.py

      - name: Run LSTM H120 seven-scenario shadow predictor
        if: steps.forecast-gate.outputs.need_lstm == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/lstm_predict_live.py

      # ==========================================================
      # 11. SKIP NOTICE
      # ==========================================================
      - name: No model needs a new forecast
        if: steps.forecast-gate.outputs.need_any != 'true'
        shell: bash
        run: |
          echo "No model needs a new forecast."
          echo "Latest observed    : ${{ steps.forecast-gate.outputs.latest_obs }}"
          echo "Latest Long issue  : ${{ steps.forecast-gate.outputs.latest_long_issue }}"
          echo "Latest LSTM issue  : ${{ steps.forecast-gate.outputs.latest_lstm_issue }}"
          echo "Long reason        : ${{ steps.forecast-gate.outputs.long_reason }}"
          echo "LSTM reason        : ${{ steps.forecast-gate.outputs.lstm_reason }}"

      # ==========================================================
      # 12. SUMMARY
      # ==========================================================
      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=============================================================="
          echo "A VUONG RAINFALL + RF + LONG-H120 + LSTM 7 SCENARIO"
          echo "=============================================================="
          echo "Event              : ${{ github.event_name }}"
          echo "Schedule           : ${{ github.event.schedule }}"
          echo "Latest observed    : ${{ steps.forecast-gate.outputs.latest_obs }}"
          echo "Latest Long issue  : ${{ steps.forecast-gate.outputs.latest_long_issue }}"
          echo "Latest LSTM issue  : ${{ steps.forecast-gate.outputs.latest_lstm_issue }}"
          echo "Need Long          : ${{ steps.forecast-gate.outputs.need_long }}"
          echo "Need LSTM          : ${{ steps.forecast-gate.outputs.need_lstm }}"
          echo "Need any           : ${{ steps.forecast-gate.outputs.need_any }}"
          echo "Long reason        : ${{ steps.forecast-gate.outputs.long_reason }}"
          echo "LSTM reason        : ${{ steps.forecast-gate.outputs.lstm_reason }}"
          echo ""
          echo "Rainfall source 1  : 6 explicit NWP x 7 basin points"
          echo "                    ECMWF / GFS / ICON / AIFS / CMA / JMA"
          echo "Rainfall source 2  : Open-Meteo Best Match x 7 basin points"
          echo ""
          echo "RF V1              : H01/H03/H06/H12/H24"
          echo "Long H120          : H01-H120 hourly, 6 NWP scenarios"
          echo "LSTM shadow        : H01-H120 hourly, 7 rainfall scenarios"
          echo "LSTM scenarios     : ECMWF/GFS/ICON/AIFS/CMA/JMA/OPENMETEO_BEST"
          echo "LSTM ensemble      : Mean/P50/P10/P90/P25/P75/Min/Max"
          echo "Expected LSTM rows : 840 scenario + 120 ensemble"
          echo "=============================================================="
