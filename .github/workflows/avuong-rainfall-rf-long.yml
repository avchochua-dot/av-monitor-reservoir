name: A Vuong Rainfall + RF Forecast + Long H120 + LSTM 7 Scenario

on:
  workflow_dispatch:
    inputs:
      force_predict:
        description: "Force RF V1 + Long-H120 + LSTM even if issue_time has not advanced"
        required: false
        default: false
        type: boolean

  # GitHub cron uses UTC.
  # HH:07 = main rainfall/NWP refresh + forecast.
  # HH:12 = retry window when observed Q may arrive late.
  schedule:
    - cron: "7 * * * *"
    - cron: "12 * * * *"

permissions:
  contents: read

concurrency:
  group: avuong-rainfall-rf-long-lstm-openmeteo7-production
  cancel-in-progress: false

jobs:
  collect-rainfall-and-predict-inflow:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESERVOIR_ID: ${{ secrets.RESERVOIR_ID }}

      FORECAST_DAYS: "10"
      BASIN_ID: "AVUONG"

      RF_MODEL_DIR: "models/rf_v1"
      RF_SOURCE: "rf_v1"
      RF_MODEL_VERSION: "RF_V1_PERFECT_RAIN"
      RF_RELEASE_TAG: "rf-v1"

      LONG_MODEL_DIR: "models/long_h120"
      LONG_SOURCE: "long_h120"
      LONG_MODEL_VERSION: "LONG_H120_V1_PERFECT_RAIN"
      LONG_MAX_LEAD: "120"

      LSTM_MODEL_DIR: "models/lstm_h120_v1"
      LSTM_SOURCE: "lstm_h120_v1"
      LSTM_MODEL_VERSION: "LSTM_H120_V1_PERFECT_RAIN"
      LSTM_MAX_LEAD: "120"
      LSTM_LOOKBACK_HOURS: "168"

      MAX_RAIN_RUN_AGE_HOURS: "12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements_rf_live.txt
            scripts/requirements_long_live.txt
            scripts/requirements_lstm_live.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -r scripts/requirements_rf_live.txt
          pip install -r scripts/requirements_long_live.txt
          pip install -r scripts/requirements_lstm_live.txt

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || (echo "ERROR: Missing SUPABASE_URL" && exit 1)
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || (echo "ERROR: Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          echo "Supabase secrets are available."

      # Main collector. The conditions now MATCH the actual HH:07 cron.
      - name: Collect 6-model rainfall at minute 07
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/avuong_multimodel_collector.py

      - name: Collect Open-Meteo Best Match at minute 07
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/avuong_openmeteo_best_collector.py

      - name: Check new observed hour for Long and LSTM independently
        id: forecast-gate
        shell: bash
        env:
          FORCE_PREDICT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_predict || false }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from supabase import create_client

          sb = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          )

          reservoir_id = (os.environ.get("RESERVOIR_ID") or "").strip()
          force = str(os.environ.get("FORCE_PREDICT", "false")).lower() == "true"

          q = (
              sb.table("reservoir_hourly_data")
              .select("time,reservoir_id")
              .order("time", desc=True)
              .limit(50 if reservoir_id else 1)
          )
          if reservoir_id:
              q = q.eq("reservoir_id", reservoir_id)

          obs_rows = q.execute().data or []
          latest_obs = obs_rows[0]["time"] if obs_rows else None

          long_rows = (
              sb.table("inflow_forecast_long_ensemble")
              .select("issue_time")
              .order("issue_time", desc=True)
              .limit(1)
              .execute()
              .data or []
          )
          latest_long_issue = long_rows[0]["issue_time"] if long_rows else None

          lstm_rows = (
              sb.table("inflow_forecast_lstm_ensemble")
              .select("issue_time")
              .order("issue_time", desc=True)
              .limit(1)
              .execute()
              .data or []
          )
          latest_lstm_issue = lstm_rows[0]["issue_time"] if lstm_rows else None

          def parse_dt(v):
              if not v:
                  return None
              return datetime.fromisoformat(
                  str(v).replace("Z", "+00:00")
              ).astimezone(timezone.utc)

          obs_dt = parse_dt(latest_obs)
          long_dt = parse_dt(latest_long_issue)
          lstm_dt = parse_dt(latest_lstm_issue)

          if force:
              need_long = True
              need_lstm = True
              long_reason = "manual force_predict=true"
              lstm_reason = "manual force_predict=true"
          elif obs_dt is None:
              need_long = False
              need_lstm = False
              long_reason = "no observed reservoir_hourly_data available"
              lstm_reason = "no observed reservoir_hourly_data available"
          else:
              if long_dt is None:
                  need_long = True
                  long_reason = "no Long-H120 forecast exists yet"
              elif obs_dt > long_dt:
                  need_long = True
                  long_reason = "observed hour is newer than Long-H120 issue_time"
              else:
                  need_long = False
                  long_reason = "Long-H120 is already current"

              if lstm_dt is None:
                  need_lstm = True
                  lstm_reason = "no LSTM-H120 forecast exists yet"
              elif obs_dt > lstm_dt:
                  need_lstm = True
                  lstm_reason = "observed hour is newer than LSTM-H120 issue_time"
              else:
                  need_lstm = False
                  lstm_reason = "LSTM-H120 is already current"

          need_any = need_long or need_lstm

          print("Latest observed time :", latest_obs)
          print("Latest Long issue    :", latest_long_issue)
          print("Latest LSTM issue    :", latest_lstm_issue)
          print("Need Long            :", need_long)
          print("Need LSTM            :", need_lstm)
          print("Need any forecast    :", need_any)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"need_long={'true' if need_long else 'false'}\n")
              f.write(f"need_lstm={'true' if need_lstm else 'false'}\n")
              f.write(f"need_any={'true' if need_any else 'false'}\n")
              f.write(f"latest_obs={latest_obs or ''}\n")
              f.write(f"latest_long_issue={latest_long_issue or ''}\n")
              f.write(f"latest_lstm_issue={latest_lstm_issue or ''}\n")
              f.write(f"long_reason={long_reason}\n")
              f.write(f"lstm_reason={lstm_reason}\n")
          PY

      # Retry collector. The condition now MATCHES the actual HH:12 cron.
      - name: Refresh 6-model rainfall on minute-12 retry
        if: github.event.schedule == '12 * * * *' && steps.forecast-gate.outputs.need_any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/avuong_multimodel_collector.py

      - name: Refresh Open-Meteo Best Match on minute-12 retry
        if: github.event.schedule == '12 * * * *' && steps.forecast-gate.outputs.need_any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/avuong_openmeteo_best_collector.py

      - name: Check latest NWP health
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from supabase import create_client

          sb = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          )

          rows = (
              sb.table("rainfall_basin_hourly")
              .select("run_time,rain_ecmwf,rain_gfs,rain_icon,rain_aifs,rain_cma,rain_jma")
              .eq("basin_id", "AVUONG")
              .order("run_time", desc=True)
              .limit(300)
              .execute()
              .data or []
          )

          if not rows:
              raise RuntimeError("NWP_MISSING")

          latest_run = rows[0]["run_time"]
          latest = [r for r in rows if r["run_time"] == latest_run]

          run_dt = datetime.fromisoformat(
              latest_run.replace("Z", "+00:00")
          ).astimezone(timezone.utc)

          now = datetime.now(timezone.utc)
          age_h = (now - run_dt).total_seconds() / 3600.0

          print("Latest NWP run:", latest_run)
          print("NWP age hours :", round(age_h, 2))
          print("Rows          :", len(latest))

          complete = True
          for col in ["rain_ecmwf","rain_gfs","rain_icon","rain_aifs","rain_cma","rain_jma"]:
              n = sum(r.get(col) is not None for r in latest)
              print(f"{col:12s}: {n}")
              if n < 120:
                  complete = False

          if not complete:
              print("NWP_STATUS=PARTIAL")
          elif age_h <= 6:
              print("NWP_STATUS=GOOD")
          elif age_h <= 12:
              print("NWP_STATUS=WARN")
          elif age_h <= 24:
              print("NWP_STATUS=DEGRADED")
          else:
              print("NWP_STATUS=STALE")
          PY

      - name: Validate RF V1 metadata files
        if: steps.forecast-gate.outputs.need_long == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f models/rf_v1/rf_h01_meta.json
          test -f models/rf_v1/rf_h03_meta.json
          test -f models/rf_v1/rf_h06_meta.json
          test -f models/rf_v1/rf_h12_meta.json
          test -f models/rf_v1/rf_h24_meta.json

      - name: Restore RF V1 model cache
        if: steps.forecast-gate.outputs.need_long == 'true'
        id: rf-model-cache
        uses: actions/cache@v4
        with:
          path: |
            models/rf_v1/rf_h01.joblib
            models/rf_v1/rf_h03.joblib
            models/rf_v1/rf_h06.joblib
            models/rf_v1/rf_h12.joblib
            models/rf_v1/rf_h24.joblib
          key: avuong-rf-models-${{ runner.os }}-rf-v1

      - name: Download RF V1 models from GitHub Release
        if: steps.forecast-gate.outputs.need_long == 'true' && steps.rf-model-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models/rf_v1
          gh release download "${RF_RELEASE_TAG}"             --pattern "rf_h01.joblib"             --pattern "rf_h03.joblib"             --pattern "rf_h06.joblib"             --pattern "rf_h12.joblib"             --pattern "rf_h24.joblib"             --dir models/rf_v1             --clobber

      - name: Validate RF artifacts
        if: steps.forecast-gate.outputs.need_long == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s models/rf_v1/rf_h01.joblib
          test -s models/rf_v1/rf_h03.joblib
          test -s models/rf_v1/rf_h06.joblib
          test -s models/rf_v1/rf_h12.joblib
          test -s models/rf_v1/rf_h24.joblib

      - name: Validate Long-H120 artifacts
        if: steps.forecast-gate.outputs.need_long == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s models/long_h120/long_h120.joblib
          test -f models/long_h120/long_h120_meta.json

      - name: Validate LSTM H120 artifacts
        if: steps.forecast-gate.outputs.need_lstm == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s models/lstm_h120_v1/lstm_h120.keras
          test -s models/lstm_h120_v1/lstm_h120_scalers.joblib

      - name: Run RF V1 inflow predictor
        id: rf-predict
        if: steps.forecast-gate.outputs.need_long == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rf_predict.py

      - name: Run Long-H120 six-scenario inflow predictor
        id: long-predict
        if: steps.forecast-gate.outputs.need_long == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rf_predict_long_h120.py

      - name: Run LSTM H120 seven-scenario shadow predictor
        id: lstm-predict
        if: steps.forecast-gate.outputs.need_lstm == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/lstm_predict_live.py

      - name: No model needs a new forecast
        if: steps.forecast-gate.outputs.need_any != 'true'
        shell: bash
        run: |
          echo "No model needs a new forecast."
          echo "Latest observed    : ${{ steps.forecast-gate.outputs.latest_obs }}"
          echo "Latest Long issue  : ${{ steps.forecast-gate.outputs.latest_long_issue }}"
          echo "Latest LSTM issue  : ${{ steps.forecast-gate.outputs.latest_lstm_issue }}"

      - name: Validate predictor outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0

          echo "RF outcome   : ${{ steps.rf-predict.outcome }}"
          echo "Long outcome : ${{ steps.long-predict.outcome }}"
          echo "LSTM outcome : ${{ steps.lstm-predict.outcome }}"

          if [ "${{ steps.forecast-gate.outputs.need_long }}" = "true" ]; then
            if [ "${{ steps.rf-predict.outcome }}" = "failure" ]; then
              echo "::error::RF V1 predictor failed"
              FAIL=1
            fi
            if [ "${{ steps.long-predict.outcome }}" = "failure" ]; then
              echo "::error::Long-H120 predictor failed"
              FAIL=1
            fi
          fi

          if [ "${{ steps.forecast-gate.outputs.need_lstm }}" = "true" ]; then
            if [ "${{ steps.lstm-predict.outcome }}" = "failure" ]; then
              echo "::error::LSTM H120 predictor failed"
              FAIL=1
            fi
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi

          echo "All required predictors completed successfully."

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          echo "=============================================================="
          echo "A VUONG RAINFALL + RF + LONG-H120 + LSTM"
          echo "Event              : ${{ github.event_name }}"
          echo "Schedule           : ${{ github.event.schedule }}"
          echo "Latest observed    : ${{ steps.forecast-gate.outputs.latest_obs }}"
          echo "Need Long          : ${{ steps.forecast-gate.outputs.need_long }}"
          echo "Need LSTM          : ${{ steps.forecast-gate.outputs.need_lstm }}"
          echo "RF outcome         : ${{ steps.rf-predict.outcome }}"
          echo "Long outcome       : ${{ steps.long-predict.outcome }}"
          echo "LSTM outcome       : ${{ steps.lstm-predict.outcome }}"
          echo "=============================================================="
