name: A Vuong - Bao cao tong hop 07h (Preview)

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Ngay bao cao Viet Nam YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: avuong-daily07-${{ inputs.report_date }}
  cancel-in-progress: false

jobs:
  create_pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install reportlab
      - name: Generate daily 07h PDF (no email)
        run: |
          python reports/avuong_kttv/scripts/generate_daily07_report.py \
            --date "${{ inputs.report_date }}" \
            --output-dir reports/avuong_kttv/reports/output
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAILY07-${{ github.run_id }}
          path: reports/avuong_kttv/reports/output/*.pdf
          if-no-files-found: warn
          retention-days: 60
