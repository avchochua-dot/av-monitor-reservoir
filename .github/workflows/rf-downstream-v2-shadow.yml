name: RF Downstream V2 Shadow

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only predict 12 horizons; do not write forecast to Supabase"
        type: boolean
        default: true
  schedule:
    - cron: "10 * * * *" # every hour at :10 UTC; model uses data issue_time

permissions:
  contents: read

concurrency:
  group: rf-downstream-v2-shadow
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install downstream RF requirements
        run: pip install -r requirements-rf-downstream.txt

      - name: Validate 12-model sequence package
        run: python scripts/check_rf_downstream_seq6_models.py --model-dir rf_downstream_v2_final_models

      - name: Generate 12 H+1...H+6 SHADOW forecasts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PCTT_API_BASE: https://av-monitor-reservoir.vercel.app
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          EXTRA=""
          if [ "$IS_DRY_RUN" = "true" ]; then
            EXTRA="--no-write"
            echo "Dry run enabled: forecasts will NOT be uploaded."
          fi
          python scripts/predict_rf_downstream_live_supabase.py --model-dir rf_downstream_v2_final_models --hours 72 --output-dir rf_downstream_v2_live_output $EXTRA

      - name: Evaluate matured forecasts
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/evaluate_rf_downstream_shadow_live.py --limit 500
