name: A Vuong - Daily 07h Bundle (3 reports, TEST)
# Supabase job 11 is unchanged. No GitHub schedule is added.
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Ngay bao cao VN YYYY-MM-DD"
        type: string
        required: true
      send_test_email:
        description: "Gui email den cac danh sach da cau hinh?"
        type: boolean
        default: false
        required: true
      force_resend:
        description: "CHI CHAY TAY: gui lai neu ky nay da SMTP_ACCEPTED truoc do"
        type: boolean
        required: false
        default: false
      retention_class:
        description: "REPORT: 30 ngay + backup; TEST: 7 ngay, chi ban thu co the xoa"
        type: choice
        required: false
        default: REPORT
        options: [REPORT, TEST]
permissions:
  contents: read
concurrency:
  group: avuong-daily07-bundle-${{ inputs.report_date }}
  cancel-in-progress: false
jobs:
  generate:
    name: Generate and archive daily 07h reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESERVOIR_ID: "is.null"
      SOURCE_TIME_MODE: "vn_label_stored_as_utc"
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
      SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'ssl' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      AV_TNR_FONT_DIR: ${{ github.workspace }}/.private-fonts
      PYTHONUNBUFFERED: "1"
      REPORT_DATE_INPUT: ${{ inputs.report_date || '' }}
      SEND_EMAIL: ${{ inputs.send_test_email && 'true' || 'false' }}
      FORCE_RESEND: ${{ inputs.force_resend && 'true' || 'false' }}
      RETENTION_CLASS: ${{ inputs.retention_class || 'REPORT' }}
      REPORT_KTTV31_TO: ${{ secrets.REPORT_KTTV31_TO }}
      REPORT_RESERVOIR_TO: ${{ secrets.REPORT_RESERVOIR_TO }}
      REPORT_HYDRO_EXCEL_TO: ${{ secrets.REPORT_HYDRO_EXCEL_TO }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # runner.temp is NOT valid in jobs.<job_id>.env.
      # Read RUNNER_TEMP only after the runner starts, then export for later steps.
      - name: Prepare report output directory
        id: archive_workspace
        shell: bash
        run: |
          set -euo pipefail

          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          : "${GITHUB_RUN_ID:?GITHUB_RUN_ID is not set}"
          : "${GITHUB_RUN_ATTEMPT:?GITHUB_RUN_ATTEMPT is not set}"

          OUT_DIR="${RUNNER_TEMP}/avuong-report-output/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p -- "$OUT_DIR"

          printf 'AV_ARCHIVE_OUT=%s\n' "$OUT_DIR" >> "$GITHUB_ENV"
          printf 'directory=%s\n' "$OUT_DIR" >> "$GITHUB_OUTPUT"

          echo "ARCHIVE_OUTPUT_READY"

      - name: Checkout private Times New Roman fonts
        uses: actions/checkout@v4
        with:
          repository: avchochua-dot/avuong-private-fonts
          ref: main
          ssh-key: ${{ secrets.AVUONG_FONTS_DEPLOY_KEY }}
          persist-credentials: false
          path: .private-fonts
      - name: Verify Times New Roman fonts
        shell: bash
        run: |
          set -euo pipefail
          test -s "$AV_TNR_FONT_DIR/times.ttf"
          test -s "$AV_TNR_FONT_DIR/timesbd.ttf"
          echo "TIMES_NEW_ROMAN_READY"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install report dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install reportlab openpyxl
      - name: Validate required files and source
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/avuong_kttv/templates/A_VUONG_BM_BC_SO_LIEU_HANG_NGAY.xlsx
          python -m py_compile reports/avuong_kttv/scripts/generate_daily07_report.py
          python -m py_compile reports/avuong_kttv/scripts/generate_daily07_bundle.py
          python -m py_compile reports/avuong_kttv/scripts/report_archive.py
      - name: Generate reports, process existing emails, archive files
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$SEND_EMAIL" == "true" ]]; then EXTRA+=(--send-email); fi
          if [[ "$FORCE_RESEND" == "true" ]]; then
            if [[ "$SEND_EMAIL" != "true" ]]; then
              echo "::error::force_resend requires send_test_email=true"
              exit 1
            fi
            EXTRA+=(--force-resend)
          fi
          python reports/avuong_kttv/scripts/report_archive.py run \
            --pipeline DAILY07_BUNDLE \
            --date "$REPORT_DATE_INPUT" \
            --retention-class "$RETENTION_CLASS" \
            --output-dir "$AV_ARCHIVE_OUT" \
            "${EXTRA[@]}"
      - name: Save fallback GitHub Artifact
        id: report_artifact
        if: ${{ always() && steps.archive_workspace.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: DAILY07-BUNDLE-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.archive_workspace.outputs.directory }}/*.pdf
            ${{ steps.archive_workspace.outputs.directory }}/*.xlsx
            ${{ steps.archive_workspace.outputs.directory }}/*.json
          if-no-files-found: warn
          retention-days: 60
      - name: Link fallback Artifact to archive run
        if: ${{ always() && steps.archive_workspace.outcome == 'success' && steps.report_artifact.outputs['artifact-url'] != '' }}
        continue-on-error: true
        env:
          AV_ARTIFACT_URL: ${{ steps.report_artifact.outputs['artifact-url'] }}
          AV_ARTIFACT_ID: ${{ steps.report_artifact.outputs['artifact-id'] }}
        shell: bash
        run: |
          set -euo pipefail
          python reports/avuong_kttv/scripts/report_archive.py link-artifact \
            --manifest "$AV_ARCHIVE_OUT/archive_manifest.json"
