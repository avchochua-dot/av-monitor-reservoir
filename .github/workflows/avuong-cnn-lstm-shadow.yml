name: A Vuong CNN-LSTM V3_1_NO_LAMBDA

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note"
        required: false
        default: ""
        type: string

  # Main rainfall workflow: HH:07, retry HH:12.
  # CNN-LSTM waits until HH:20.
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: read

concurrency:
  group: avuong-cnn-lstm-v3-shadow
  cancel-in-progress: false

jobs:
  cnn-lstm-v3-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESERVOIR_ID: ${{ secrets.RESERVOIR_ID }}

      BASIN_ID: "AVUONG"
      CNN_LSTM_MODEL_DIR: "models/cnn_lstm_h120_v3"
      CNN_LSTM_SOURCE: "cnn_lstm_h120_v3"
      CNN_LSTM_MODEL_VERSION: "CNN_LSTM_H120_V3_SHORT_PEAK_AWARE"
      CNN_LSTM_MAX_LEAD: "120"
      CNN_LSTM_LOOKBACK_HOURS: "168"
      MAX_RAIN_RUN_AGE_HOURS: "12"

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Pull Git LFS model artifacts
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs pull

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements_lstm_live.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r scripts/requirements_lstm_live.txt

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)

      - name: Validate CNN-LSTM V3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          MODEL="models/cnn_lstm_h120_v3/cnn_lstm_h120_v3.keras"
          SCALER="models/cnn_lstm_h120_v3/cnn_lstm_h120_v3_scalers.joblib"

          test -s "$MODEL"
          test -s "$SCALER"

          python - <<'PY'
          import zipfile
          model = "models/cnn_lstm_h120_v3/cnn_lstm_h120_v3.keras"
          if not zipfile.is_zipfile(model):
              raise SystemExit("ERROR: CNN-LSTM .keras is not a valid Keras zip archive.")
          PY

      - name: Check latest NWP freshness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from supabase import create_client

          sb = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          )

          rows = (
              sb.table("rainfall_basin_hourly")
              .select("run_time")
              .eq("basin_id", "AVUONG")
              .order("run_time", desc=True)
              .limit(1)
              .execute()
              .data or []
          )

          if not rows:
              raise RuntimeError("NWP_MISSING")

          run_time = rows[0]["run_time"]
          run_dt = datetime.fromisoformat(
              run_time.replace("Z", "+00:00")
          ).astimezone(timezone.utc)

          age_h = (
              datetime.now(timezone.utc) - run_dt
          ).total_seconds() / 3600.0

          print("Latest NWP run:", run_time)
          print("NWP age hours :", round(age_h, 2))

          if age_h > 12:
              raise RuntimeError(f"NWP_STALE: {age_h:.1f}h > 12h")
          PY

      - name: Smoke test model and scaler bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import joblib
          import tensorflow as tf

          model_path="models/cnn_lstm_h120_v3/cnn_lstm_h120_v3.keras"
          scaler_path="models/cnn_lstm_h120_v3/cnn_lstm_h120_v3_scalers.joblib"

          model=tf.keras.models.load_model(
              model_path,
              compile=False,
              safe_mode=False
          )
          bundle=joblib.load(scaler_path)

          assert int(bundle["lookback"]) == 168
          assert int(bundle["horizon"]) == 120
          assert "short_blend_alphas" in bundle

          print("Model       :", model.name)
          print("Input shape :", model.input_shape)
          print("Output shape:", model.output_shape)
          PY

      - name: Run CNN-LSTM V3 seven-scenario shadow predictor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cnn_lstm_predict_live.py

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          echo "=============================================================="
          echo "A VUONG CNN-LSTM V3 SHADOW"
          echo "Event         : ${{ github.event_name }}"
          echo "Schedule      : ${{ github.event.schedule }}"
          echo "Expected rows : 840 scenario + 120 ensemble"
          echo "Mode          : SHADOW ONLY"
          echo "Cron          : HH:20 UTC"
          echo "=============================================================="
